apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mermify.fullname" . }}-test-connection"
  labels:
    {{- include "mermify.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://{{ include "mermify.fullname" . }}:{{ .Values.service.port }}/"]
  restartPolicy: Never
