# yaml-language-server: $schema=https://raw.githubusercontent.com/tra-sco/mermify/main/chart/values.schema.json

# -- Number of pod replicas. Ignored when autoscaling.enabled is true.
replicaCount: 1

image:
  repository: ghcr.io/tra-sco/mermify
  # -- Image tag. Defaults to the chart's appVersion when empty.
  tag: ""
  # -- Pin by digest instead of tag, e.g. "sha256:...". Takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Overrides the chart's computed name.
nameOverride: ""
# -- Overrides the chart's computed full name.
fullnameOverride: ""

# -- Labels applied to every object this chart renders.
commonLabels: {}
# -- Annotations applied to every object this chart renders.
commonAnnotations: {}

serviceAccount:
  create: true
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty.
  name: ""
  annotations: {}
  # -- Mermify never calls the Kubernetes API, so the SA token is not mounted by default.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- Disabled by default. Set enabled: true and supply a probe to gate slow starts.
startupProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  nodePort: ""
  annotations: {}
  labels: {}

# -- Gateway API HTTPRoute (recommended; the Ingress API is no longer actively developed). Requires Gateway API CRDs + a Gateway resource.
httpRoute:
  enabled: false
  # -- Gateway(s) this HTTPRoute attaches to.
  parentRefs:
    - name: example-gateway
      # namespace: gateway-system
      # sectionName: https
  hostnames:
    - mermify.example.com
  annotations: {}
  labels: {}
  # -- Extra HTTPRoute rules appended after the default "/" prefix match.
  extraRules: []

# -- Legacy networking.k8s.io/v1 Ingress; prefer httpRoute unless your cluster lacks Gateway API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mermify.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mermify-tls
  #    hosts:
  #      - mermify.example.com

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: ""

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

nginx:
  # -- Use an existing ConfigMap for the nginx server block instead of the chart's default.
  existingConfigMap: ""
  # -- nginx server block mounted at /etc/nginx/conf.d/default.conf; override to change the CSP without rebuilding the image.
  config: |
    server {
        listen 8080;
        server_tokens off;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'";

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        root /usr/share/nginx/html;
        index index.html;

        location /docs/ {
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header Referrer-Policy strict-origin-when-cross-origin;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'";
            try_files $uri $uri/ /docs/index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
extraContainerPorts: []
# -- Arbitrary extra manifests to render alongside the chart's own objects.
extraObjects: []

# -- Legacy: rendered into podAnnotations to force a rollout. Prefer podAnnotations directly.
manifestHash: ""
